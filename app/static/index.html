<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Provider Observer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <div class="eyebrow">AI PROVIDER OBSERVER</div>
        <h1>Пакеты и лимиты</h1>

  <script src="/static/app.js"></script>
