# Docker Compose v2+ schema (https://docs.docker.com/compose/compose-file/).
# Run with:   docker compose up -d
# Restart it: docker compose restart
# Logs:       docker compose logs -f observer
#
# The service auto-restarts on crashes, on host reboot, and on
# Docker daemon restart (see `restart:` policy below). The bundled
# Dockerfile also installs a HEALTHCHECK, so `docker compose ps` will
# show a `healthy` / `unhealthy` status in addition to up/exited.

name: ai-provider-observer

services:
  observer:
    # Pre-built image (tag matches the local build from `docker compose build`).
    # If you change the Dockerfile, run `docker compose build` first so the
    # image is refreshed — the container will be recreated automatically.
    image: ai-provider-observer:latest
    build:
      context: .
      # Offline variant: layers on top of the previously built runtime image
      # (no registry access needed). Switch back to "Dockerfile" when the
      # Docker daemon has internet egress.
      dockerfile: Dockerfile.offline
    container_name: ai-provider-observer
    restart: unless-stopped
    init: true  # use tini inside the container as PID 1
    env_file:
      - .env
    environment:
      # Make sure paths inside the container resolve to the mounted volume.
      DATABASE_PATH: /app/data/observer.db
      # Where the container finds the host Codex CLI credentials (read-only
      # mount below). Explicit, so it does not depend on the image's $HOME.
      CODEX_HOME: /app/codex-home
      # Corporate egress: chatgpt.com answers 403 to direct datacenter
      # connections, host traffic goes through this proxy (httpx honors
      # these automatically). NO_PROXY keeps local healthchecks direct.
      HTTP_PROXY: http://mow2-it-proxy-haproxy.partner.ru:3128
      HTTPS_PROXY: http://mow2-it-proxy-haproxy.partner.ru:3128
      NO_PROXY: localhost,127.0.0.1,::1
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Persist SQLite database + WAL files across container restarts/rebuilds.
      - ./data:/app/data
      # Feed Codex quota monitoring from your local Codex CLI login
      # (Linux/macOS hosts). Read-only: the observer only reads auth.json.
      # NOTE: absolute path on purpose — with snap docker, `~` expands to the
      # daemon's snap HOME (…/snap/docker/<rev>), where ~/.codex is empty,
      # which silently disables Codex collection after every daemon update.
      - /home/yurig/.codex:/app/codex-home:ro
    healthcheck:
      # curl-free check: the slim runtime image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Compose deploy keys only apply on Swarm; kept for portability.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
